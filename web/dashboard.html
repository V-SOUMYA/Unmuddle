<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session dashboard | Unmuddle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="wordmark" href="/">Un<span class="tangle">muddle</span></a>
      <a class="btn ghost" href="/#lessons">New session</a>
    </header>

    <main id="main">
      <section class="session-bar">
        <div>
          <h1 id="title" style="font-size:clamp(1.8rem,4vw,2.6rem)">Loading session…</h1>
          <div class="status-row">
            <div>
              <div class="live-count" id="learners">0</div>
              <div class="muted">learners have answered</div>
            </div>
            <button class="btn" id="analyze-btn" type="button" disabled>Find misconceptions</button>
          </div>
          <p class="error" id="error" role="alert"></p>
        </div>
        <div class="join-card">
          <img id="qr" alt="QR code to join this session">
          <div>
            <div class="muted small">Join at this site with code</div>
            <div class="code" id="code">······</div>
            <a class="small" id="join-link" href="#" target="_blank" rel="noopener">Open the learner page</a>
          </div>
        </div>
      </section>

      <div id="notice"></div>
      <div id="report">
        <p class="empty">When your group has answered, press <strong>Find misconceptions</strong>. You'll see each wrong idea, how many people hold it, and how to fix it.</p>
      </div>
    </main>
  </div>

  <script src="common.js"></script>
  <script>
    const code = (param("code") || "").toUpperCase();
    const analyzeBtn = document.getElementById("analyze-btn");
    const errorBox = document.getElementById("error");
    let analyzed = false;

    function renderMyth(m) {
      const stats = m.follow_up_stats || { attempted: 0, fixed: 0 };
      const quotes = m.examples.map(e => `<li>${esc(e)}</li>`).join("");
      return `
        <article class="myth">
          <div class="myth-head">
            <h3 class="myth-title">${esc(m.title)}</h3>
            <span class="myth-count">${m.size}<small> ${m.size === 1 ? "learner" : "learners"}</small></span>
          </div>
          ${dots(m.size, stats.fixed)}
          <p class="why">${esc(m.explanation)}</p>
          <div class="fix"><strong>2-minute fix</strong><p>${esc(m.fix)}</p></div>
          <details>
            <summary>What they wrote, and why it's tempting</summary>
            <p class="why">${esc(m.why_tempting)}</p>
            <ul class="quotes">${quotes}</ul>
          </details>
          <p class="check">
            <span class="fixed-count">${stats.fixed} of ${m.size}</span> fixed it on the follow-up question${stats.attempted > stats.fixed ? `, ${stats.attempted - stats.fixed} still muddled` : ""}.
            <br>Follow-up: ${esc(m.follow_up_question)}
          </p>
        </article>`;
    }

    function renderReport(r) {
      document.getElementById("notice").innerHTML = r.new_answers_since_analysis
        ? `<p class="notice">New answers came in after this analysis. Press Find misconceptions again to include them.</p>`
        : "";
      document.getElementById("report").innerHTML = r.questions.map(q => {
        const wrong = q.n_answers - q.n_correct;
        // Shared misconceptions get full cards; one-off ideas are folded away.
        const shared = q.misconceptions.filter(m => m.size > 1);
        const oneOff = shared.length ? q.misconceptions.filter(m => m.size === 1) : [];
        const main = shared.length ? shared : q.misconceptions;
        let body = main.length
          ? main.map(renderMyth).join("")
          : `<p class="all-right">Everyone got this one. Move on.</p>`;
        if (oneOff.length) {
          body += `
            <details class="one-offs">
              <summary>${oneOff.length} more wrong ${oneOff.length === 1 ? "idea" : "ideas"} held by one learner each</summary>
              <ul class="quotes">${oneOff.map(m => `<li><strong>${esc(m.title)}</strong><br>${esc(m.examples[0] || "")}</li>`).join("")}</ul>
            </details>`;
        }
        return `
          <section class="question-block">
            <header>
              <h2>${esc(q.topic)}</h2>
              <p class="question-text">${esc(q.text)}</p>
              <p class="score-line">${q.n_correct} of ${q.n_answers} got it right. ${wrong} muddled.</p>
            </header>
            ${body}
          </section>`;
      }).join("");
    }

    async function refreshSession() {
      try {
        const s = await api(`/api/sessions/${code}`);
        document.getElementById("title").textContent = s.title;
        document.getElementById("learners").textContent = s.n_learners;
        analyzeBtn.disabled = s.n_learners === 0;
        analyzeBtn.textContent = s.analyzed ? "Find misconceptions again" : "Find misconceptions";
        if (s.analyzed && !analyzed) { analyzed = true; refreshReport(); }
      } catch (e) {
        document.getElementById("title").textContent = "Session not found";
        errorBox.textContent = "Check the code in the address bar, or start a new session.";
        throw e;
      }
    }

    async function refreshReport() {
      try { renderReport(await api(`/api/sessions/${code}/report`)); } catch (_) { /* not analyzed yet */ }
    }

    analyzeBtn.addEventListener("click", async () => {
      analyzeBtn.disabled = true;
      errorBox.textContent = "";
      const previous = analyzeBtn.textContent;
      analyzeBtn.textContent = "Reading every answer…";
      try {
        renderReport(await api(`/api/sessions/${code}/analyze`, { method: "POST" }));
        analyzed = true;
        analyzeBtn.textContent = "Find misconceptions again";
      } catch (e) {
        errorBox.textContent = e.message;
        analyzeBtn.textContent = previous;
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    (async function start() {
      if (!code) { location.href = "/"; return; }
      const joinUrl = `${location.origin}/join.html?code=${code}`;
      document.getElementById("code").textContent = code;
      document.getElementById("qr").src = `/api/sessions/${code}/qr.svg`;
      document.getElementById("join-link").href = joinUrl;
      try { await refreshSession(); } catch (_) { return; }
      // Live: new learners every 3 s, follow-up results every 5 s.
      setInterval(refreshSession, 3000);
      setInterval(() => { if (analyzed) refreshReport(); }, 5000);
    })();
  </script>
</body>
</html>
